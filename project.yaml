project:
  name: wechat-article-scheduler
  status: active
  owner: user
  language: zh-CN
  purpose: local_wechat_draft_workbench

runtime:
  language: python
  minimum_python: "3.10"
  cli: ".venv/bin/python -m wechat_article_scheduler.cli"
  web_url: "http://127.0.0.1:8080/"
  database: "data/app.sqlite3"
  default_mode: mock

scope:
  includes:
    - local_article_import_and_dedupe
    - local_scheduling
    - wechat_draft_create_and_update
    - remote_read_only_sync
    - external_agent_task_packages
    - human_supplied_publish_proof
  excludes:
    - automatic_final_publish
    - remote_draft_deletion
    - built_in_browser_agent
    - multi_platform_publishing
    - automatic_content_review

authority:
  agent_rules: AGENTS.md
  user_entry: README.md
  docs_index: docs/index.md

safety:
  final_publish_api_present: false
  real_mode_requires_explicit_environment: true
  secrets_are_local_only: true
  user_content_is_protected: true
